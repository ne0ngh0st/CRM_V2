memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Codigo e copiado (imutavel) na imagem pra esse teste, entao desligar a
; revalidacao evita stat() por arquivo em toda requisicao — igual configuracao
; de producao real (Forge tipicamente roda com isso desligado tambem).
opcache.validate_timestamps = 0
