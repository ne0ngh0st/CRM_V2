[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

; Dimensionado pra um servidor modesto (t3.medium: 2 vCPU / 4GB), parecido
; com o que rodaria no Forge em producao. Isso e o que da concorrencia
; real de verdade (vs. o php artisan serve, que processa 1 requisicao
; por vez) — ate 20 requisicoes PHP simultaneas antes de comecar a filar.
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500

clear_env = no
