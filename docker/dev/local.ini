memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Codigo vem de bind-mount (Windows->WSL2->container), que e MUITO lento pra
; stat() por arquivo. Com revalidate_freq=0 o opcache fazia stat() em todo
; arquivo PHP incluido a CADA request, multiplicando o custo do bind-mount e
; deixando toda pagina em 4-6s. revalidate_freq=2 ainda reflete mudanca de
; codigo em ~2s (imperceptivel editando localmente), mas so faz essa checagem
; uma vez a cada 2s por arquivo, nao em toda request.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
