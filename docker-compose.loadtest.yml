services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - APP_URL=http://localhost:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
